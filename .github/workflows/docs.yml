name: Documentation quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate documentary configuration and links
        run: python scripts/check_docs.py
      - name: Test documentation guardrails
        run: python -m unittest discover -s tests -p test_documentation.py -v
      - name: Compile quality scripts
        run: python -m compileall -q scripts tests lab
      - name: Check whitespace
        run: git diff --check HEAD

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install baseline test runner (before B1)
        if: ${{ hashFiles('pyproject.toml') == '' }}
        run: python -m pip install pytest==9.1.1
      - name: Install project test dependencies (after B1)
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: |
          python -m pip install --no-deps -r requirements.lock
          python -m pip install --no-deps setuptools==84.0.0
          python -m pip install --no-build-isolation --no-deps -e ".[test]"
          python -m pip check
      - name: Run Python tests
        run: python -m pytest -q tests
      # No cloud, credentials or real accounts are required by this job.

  node-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install locked contract dependencies without lifecycle scripts
        working-directory: contracts/validate/node
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate golden contract examples
        working-directory: contracts/validate/node
        run: node validate.mjs
      - name: Test preserved browser fixture harness
        run: node --test lab/browser/selftest.mjs

  browser-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install locked browser worker dependencies without lifecycle scripts
        working-directory: workers/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test browser worker contracts and failure boundaries
        run: node --test workers/browser/selftest.mjs
      - name: Verify owned Linux process groups are cleaned
        if: runner.os == 'Linux'
        run: node --test workers/browser/process-selftest.mjs
      # Chromium/RIE gates remain separate, sequential resource-guarded trials.
      # These lightweight tests do not verify real cookies, sources or AWS.

  go:
    strategy:
      fail-fast: false
      matrix:
        module: [contracts/validate/go, go, lab/sessions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOFLAGS: '-mod=readonly'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Download and verify pinned module dependencies
        run: |
          go mod download
          go mod verify
      - name: Vet fixture-only module
        run: go vet ./...
      - name: Test contracts or fake worker without dependency network access
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: go test -count=1 ./...
