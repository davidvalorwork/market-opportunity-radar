[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.0.0"
description = "Market Opportunity Radar: shared contracts skeleton, no commerce pipeline yet."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "hypothesis==6.168.3"]
aws = ["boto3==1.43.108"]
aws-test = ["boto3==1.43.108", "moto[dynamodb]==5.2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radar = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
